<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>法廷の彼方に</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    background: #050810;
    color: #e8d7a0;
    -webkit-user-select: none;
    user-select: none;
  }
  #game {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    height: calc(var(--vh, 1vh) * 100);
    overflow: hidden;
    background: #0a1428;
  }

.scene {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
display: none;
flex-direction: column;
}
.scene.active { display: flex; }

/* タイトル */
#title-scene {
justify-content: center;
align-items: center;
padding: 30px 20px 50px;
text-align: center;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.title-sub-en {
letter-spacing: 0.4em;
font-size: 11px;
color: #8a7a4d;
margin-bottom: 14px;
}
.title-main {
font-size: 42px;
font-weight: 700;
letter-spacing: 0.15em;
color: #d4af37;
margin-bottom: 6px;
}
.title-sub {
font-size: 12px;
color: #b8a370;
letter-spacing: 0.5em;
margin-bottom: 36px;
}
.title-line {
width: 200px;
height: 1px;
margin: 0 auto 30px;
background: #d4af37;
}
.menu-btn-group { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.menu-btn {
padding: 14px 36px;
background: transparent;
border: 1px solid #d4af37;
color: #e8d7a0;
font-family: inherit;
font-size: 13px;
letter-spacing: 0.3em;
cursor: pointer;
min-width: 240px;
}
.menu-btn:active { background: rgba(212, 175, 55, 0.2); }
.menu-btn.small { font-size: 11px; padding: 10px 24px; min-width: 200px; }
.title-caption {
margin-top: 36px;
font-size: 10px;
color: #5a4f33;
letter-spacing: 0.15em;
line-height: 1.8;
}
.save-info {
margin-top: 16px;
font-size: 9px;
color: #6a5a33;
letter-spacing: 0.2em;
}

/* ノベル */
#novel-scene {
justify-content: flex-end;
overflow: hidden;
}
.bg-layer {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
z-index: 0;
}
.bg-courthouse { background: #1a1208; }
.bg-tense { background: #1a0808; }
.bg-calm { background: #0a1020; }
.bg-crimson { background: #2a0a0a; }
.bg-dawn { background: #1a1408; }
.bg-office { background: #0a1410; }
.bg-archive { background: #100a18; }
.bg-purple { background: #18082a; }
.bg-factory { background: #1a1004; }
.bg-market { background: #1a1408; }
.bg-void { background: #20081a; }

.char-portrait {
position: relative;
z-index: 1;
width: 200px;
max-width: 50vw;
aspect-ratio: 1 / 1;
margin: 14px auto 0;
flex-shrink: 0;
}
.char-card {
width: 100%;
height: 100%;
border: 1px solid currentColor;
background: rgba(0, 0, 0, 0.5);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 0;
position: relative;
overflow: hidden;
}
.char-card.has-img {
padding: 0;
}
.char-img {
width: 100%;
height: 100%;
object-fit: cover;
display: block;
}
.char-card-name-overlay {
position: absolute;
bottom: 0;
left: 0;
right: 0;
background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85));
padding: 18px 10px 8px;
text-align: center;
color: inherit;
}
.char-card-name-overlay .char-name {
font-size: 18px;
text-shadow: 0 0 4px rgba(0,0,0,0.8);
}
.char-card-name-overlay .char-title {
font-size: 9px;
text-shadow: 0 0 4px rgba(0,0,0,0.8);
}
.char-symbol-corner {
position: absolute;
top: 6px;
right: 6px;
width: 26px;
height: 26px;
background: rgba(0, 0, 0, 0.7);
border: 1px solid currentColor;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
z-index: 2;
}
.char-symbol {
font-size: 48px;
margin-bottom: 8px;
}
.char-name {
font-size: 22px;
font-weight: 700;
letter-spacing: 0.1em;
}
.char-title {
font-size: 10px;
letter-spacing: 0.25em;
margin-top: 6px;
opacity: 0.8;
}

/* キャラ色 */
.c-kenpou { color: #e8e0c0; }
.c-minpou { color: #f0c870; }
.c-keihou { color: #d04848; }
.c-minji { color: #80a8d0; }
.c-keiji { color: #9080d8; }
.c-kaisha { color: #d4af37; }
.c-roudou { color: #70b070; }
.c-zeihou { color: #b0b0c0; }
.c-gyosei { color: #60a890; }
.c-chizai { color: #d8a0d8; }
.c-narrator { color: #8a7a4d; }
.c-enemy { color: #ff4040; }

.dialog-box {
position: relative;
z-index: 2;
margin: auto 14px 32px;
background: rgba(8, 10, 18, 0.92);
border: 1px solid #6a5a33;
padding: 16px 20px 22px;
min-height: 140px;
flex-shrink: 0;
}
.speaker {
font-size: 13px;
letter-spacing: 0.2em;
margin-bottom: 10px;
}
.speaker.empty { display: none; }

.dialog-text {
font-size: 15px;
line-height: 1.9;
color: #e8d7a0;
min-height: 80px;
letter-spacing: 0.03em;
white-space: pre-wrap;
}
.dialog-text.narration {
color: #a89870;
font-style: italic;
font-size: 14px;
}
.next-indicator {
position: absolute;
bottom: 8px; right: 12px;
color: #d4af37;
font-size: 12px;
}

/* 選択肢 */
.choices {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0, 0, 0, 0.85);
display: none;
flex-direction: column;
justify-content: center;
align-items: center;
z-index: 10;
padding: 20px;
}
.choices.active { display: flex; }
.choices-title {
color: #d4af37;
letter-spacing: 0.3em;
font-size: 13px;
margin-bottom: 18px;
text-align: center;
}
.choice-btn {
width: 100%;
max-width: 340px;
padding: 14px 18px;
background: rgba(10, 14, 24, 0.9);
border: 1px solid #8a7a4d;
color: #e8d7a0;
font-family: inherit;
font-size: 13px;
text-align: left;
cursor: pointer;
line-height: 1.6;
margin-bottom: 12px;
}
.choice-btn:active {
background: rgba(212, 175, 55, 0.25);
border-color: #d4af37;
}

/* パーティ編成 */
#party-scene {
padding: 14px 14px 30px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
align-items: center;
}
.header-block {
text-align: center;
margin-bottom: 14px;
width: 100%;
}
.header-jp {
color: #d4af37;
letter-spacing: 0.4em;
font-size: 16px;
margin-bottom: 4px;
}
.header-en {
color: #8a7a4d;
letter-spacing: 0.3em;
font-size: 9px;
}
.party-instruction {
color: #b8a370;
font-size: 11px;
margin: 8px 0 14px;
text-align: center;
}
.roster-grid {
display: grid;
grid-template-columns: 1fr 1fr;
gap: 8px;
width: 100%;
max-width: 380px;
margin-bottom: 14px;
}
.roster-card {
border: 1px solid currentColor;
background: rgba(10, 14, 24, 0.8);
padding: 10px 8px;
cursor: pointer;
}
.roster-card.locked {
opacity: 0.35;
cursor: not-allowed;
}
.roster-card.selected {
background: rgba(212, 175, 55, 0.2);
}
.roster-card .num {
font-size: 9px;
opacity: 0.6;
text-align: right;
}
.roster-row { display: flex; align-items: center; gap: 8px; }
.roster-symbol {
font-size: 26px;
flex-shrink: 0;
width: 44px;
height: 44px;
display: flex;
align-items: center;
justify-content: center;
border: 1px solid currentColor;
overflow: hidden;
position: relative;
}
.roster-symbol img {
width: 100%;
height: 100%;
object-fit: cover;
}
.roster-info { flex: 1; min-width: 0; }
.roster-name {
font-size: 13px;
font-weight: 700;
}
.roster-title {
font-size: 8px;
letter-spacing: 0.2em;
opacity: 0.7;
margin-top: 2px;
}
.roster-stats {
margin-top: 6px;
display: flex;
gap: 8px;
font-size: 9px;
}
.roster-stat { color: #b8a370; }
.roster-stat b { color: #e8d7a0; }
.roster-locked-text {
color: #6a5a33;
font-size: 9px;
text-align: center;
margin-top: 6px;
}
.party-slot-row {
display: flex;
justify-content: center;
gap: 10px;
margin: 14px 0;
}
.party-slot {
width: 58px; height: 66px;
border: 1px dashed #6a5a33;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
font-size: 24px;
background: rgba(0, 0, 0, 0.4);
color: #5a4f33;
overflow: hidden;
position: relative;
}
.party-slot.filled {
border: 1px solid currentColor;
background: rgba(0, 0, 0, 0.6);
}
.party-slot-img {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
width: 100%;
height: 100%;
object-fit: cover;
}
.party-slot .slot-name {
font-size: 8px;
margin-top: 2px;
position: relative;
z-index: 2;
background: rgba(0,0,0,0.7);
padding: 1px 4px;
align-self: stretch;
text-align: center;
}
.party-slot .slot-symbol {
position: relative;
z-index: 2;
background: rgba(0,0,0,0.7);
border-radius: 50%;
width: 22px;
height: 22px;
display: flex;
align-items: center;
justify-content: center;
font-size: 13px;
margin-top: 2px;
}
.party-confirm {
padding: 12px 30px;
margin-top: 6px;
}
.party-confirm:disabled {
opacity: 0.3;
cursor: not-allowed;
}

/* バトル */
#battle-scene {
padding: 8px 8px 20px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.battle-bg {
position: fixed;
top: 0; left: 0; right: 0; bottom: 0;
z-index: 0;
background: #1a0606;
}
.battle-top {
position: relative; z-index: 1;
padding: 6px 10px;
display: flex;
justify-content: space-between;
align-items: center;
font-size: 10px;
color: #b8a370;
}
.battle-top .turn-info { color: #d4af37; }
.enemy-zone {
position: relative; z-index: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 8px 0;
}
.enemy-card {
width: 150px;
aspect-ratio: 3 / 4;
border: 1px solid #c04040;
background: rgba(40, 10, 10, 0.7);
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
color: #f0a0a0;
position: relative;
}
.enemy-card.hit { animation: shake 0.4s; }
@keyframes shake {
0%, 100% { transform: translateX(0); }
25% { transform: translateX(-8px); }
75% { transform: translateX(8px); }
}
.enemy-card.dying {
animation: dying 1.2s forwards;
}
@keyframes dying {
to { opacity: 0; transform: scale(0.7); }
}
.enemy-symbol {
font-size: 40px;
}
.enemy-name {
font-size: 14px;
letter-spacing: 0.2em;
margin-top: 6px;
font-weight: 700;
}
.enemy-title {
font-size: 9px;
letter-spacing: 0.2em;
opacity: 0.8;
margin-top: 3px;
}
.hp-bar-wrap {
width: 220px;
max-width: 65vw;
margin-top: 10px;
}
.hp-label {
display: flex;
justify-content: space-between;
font-size: 10px;
color: #f0a0a0;
margin-bottom: 3px;
}
.hp-bar {
width: 100%;
height: 7px;
background: rgba(80, 20, 20, 0.6);
border: 1px solid #c04040;
overflow: hidden;
}
.hp-fill {
height: 100%;
background: #f06060;
transition: width 0.5s ease;
}
.status-icons {
display: flex;
gap: 4px;
margin-top: 4px;
min-height: 14px;
}
.status-icon {
font-size: 10px;
padding: 1px 5px;
background: rgba(0, 0, 0, 0.6);
border: 1px solid #d4af37;
color: #d4af37;
}
.status-icon.poison { color: #80f080; border-color: #80f080; }
.status-icon.stun { color: #f0e080; border-color: #f0e080; }
.status-icon.buff { color: #80c8f0; border-color: #80c8f0; }

.battle-log {
position: relative; z-index: 1;
margin: 6px 0;
padding: 8px 12px;
min-height: 42px;
background: rgba(0, 0, 0, 0.6);
border-left: 2px solid #d4af37;
font-size: 12px;
color: #e8d7a0;
line-height: 1.5;
}
.battle-log.advantage { border-left-color: #70d870; color: #c0f0c0; }
.battle-log.weakness { border-left-color: #d870d8; color: #f0c0f0; }

.ally-row {
position: relative; z-index: 1;
display: flex;
gap: 5px;
margin-bottom: 6px;
}
.ally-card {
flex: 1;
border: 1px solid currentColor;
background: rgba(10, 14, 24, 0.85);
padding: 6px 4px;
position: relative;
text-align: center;
}
.ally-card.acting {
background: rgba(212, 175, 55, 0.15);
}
.ally-card.fainted {
opacity: 0.35;
}
.ally-card.hit { animation: shake 0.3s; }
.ally-symbol {
font-size: 18px;
width: 36px;
height: 36px;
margin: 0 auto;
display: flex;
align-items: center;
justify-content: center;
border-radius: 4px;
overflow: hidden;
position: relative;
background: rgba(0,0,0,0.4);
}
.ally-symbol img {
width: 100%;
height: 100%;
object-fit: cover;
}
.ally-name {
font-size: 9px;
margin-top: 2px;
font-weight: 700;
}
.ally-hp {
font-size: 9px;
margin-top: 2px;
color: #c0e0a0;
}
.ally-hp-bar {
height: 3px;
background: rgba(0, 0, 0, 0.6);
margin-top: 3px;
overflow: hidden;
}
.ally-hp-fill {
height: 100%;
background: #a0f060;
transition: width 0.4s ease;
}
.ally-hp-fill.low { background: #f0a060; }
.ally-hp-fill.critical { background: #f06060; }
.ally-statuses {
position: absolute;
top: -6px; left: 0; right: 0;
display: flex;
gap: 2px;
justify-content: center;
}
.ally-statuses .status-icon { font-size: 8px; padding: 0 3px; }

.skill-zone {
position: relative; z-index: 1;
display: grid;
grid-template-columns: 1fr 1fr;
gap: 4px;
padding-bottom: 4px;
}
.skill-btn {
padding: 10px 8px;
background: rgba(10, 14, 24, 0.9);
border: 1px solid currentColor;
color: inherit;
font-family: inherit;
cursor: pointer;
display: flex;
align-items: center;
gap: 6px;
position: relative;
text-align: left;
}
.skill-btn:active {
background: rgba(212, 175, 55, 0.2);
}
.skill-btn:disabled {
opacity: 0.3;
cursor: not-allowed;
}
.skill-btn .si { font-size: 18px; flex-shrink: 0; }
.skill-btn .sd { flex: 1; min-width: 0; }
.skill-btn .sn { font-size: 11px; font-weight: 700; }
.skill-btn .sc {
font-size: 9px;
color: #80c8f0;
margin-top: 1px;
}
.skill-tag {
position: absolute;
top: -7px; right: -3px;
font-size: 8px;
padding: 1px 5px;
background: #70d870;
color: #000;
font-weight: 700;
}
.skill-tag.weak { background: #d870d8; }

/* エフェクト */
.damage-pop {
position: absolute;
top: 30%; left: 50%;
transform: translateX(-50%);
font-size: 36px;
font-weight: 900;
color: #ffeb70;
text-shadow: 2px 2px 0 #000;
pointer-events: none;
animation: damagePop 1s ease-out forwards;
z-index: 20;
}
.damage-pop.crit {
color: #ff60a0;
font-size: 50px;
}
.damage-pop.weak {
color: #a080ff;
font-size: 26px;
}
@keyframes damagePop {
0% { opacity: 0; transform: translate(-50%, 0); }
20% { opacity: 1; transform: translate(-50%, -30px); }
100% { opacity: 0; transform: translate(-50%, -80px); }
}
.ally-damage-pop {
position: absolute;
top: -10px; left: 50%;
transform: translateX(-50%);
font-size: 20px;
font-weight: 900;
color: #ff6060;
text-shadow: 1px 1px 0 #000;
pointer-events: none;
animation: damagePop 1s ease-out forwards;
z-index: 20;
}
.ally-damage-pop.heal { color: #80f0a0; }

.flash {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(255, 220, 100, 0.4);
pointer-events: none;
animation: flash 0.3s ease-out forwards;
z-index: 15;
}
.flash.dark { background: rgba(100, 30, 30, 0.5); }
@keyframes flash {
to { opacity: 0; }
}

.levelup-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: rgba(0, 0, 0, 0.85);
z-index: 30;
display: none;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 30px 20px;
}
.levelup-overlay.show { display: flex; }
.levelup-title {
color: #ffeb70;
font-size: 22px;
letter-spacing: 0.4em;
margin-bottom: 18px;
}
.levelup-list {
display: flex;
flex-direction: column;
gap: 8px;
width: 100%;
max-width: 320px;
}
.levelup-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 8px 12px;
background: rgba(212, 175, 55, 0.1);
border: 1px solid #d4af37;
color: #e8d7a0;
font-size: 12px;
}
.levelup-row .lv-after { color: #ffeb70; font-weight: 700; }
.levelup-close {
margin-top: 22px;
padding: 10px 30px;
background: transparent;
border: 1px solid #d4af37;
color: #e8d7a0;
font-family: inherit;
font-size: 11px;
letter-spacing: 0.3em;
cursor: pointer;
}

/* エンディング */
#ending-scene {
justify-content: flex-start;
align-items: center;
padding: 30px 22px 40px;
text-align: center;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.ending-content { max-width: 400px; }
.ending-title {
font-size: 14px;
letter-spacing: 0.5em;
color: #8a7a4d;
margin-bottom: 14px;
}
.ending-route {
font-size: 11px;
letter-spacing: 0.4em;
color: #d4af37;
margin-bottom: 18px;
padding: 6px 16px;
border-top: 1px solid #d4af37;
border-bottom: 1px solid #d4af37;
display: inline-block;
}
.ending-main {
font-size: 30px;
color: #d4af37;
letter-spacing: 0.2em;
margin-bottom: 20px;
margin-top: 8px;
}
.ending-body {
font-size: 13px;
line-height: 2.1;
color: #c8b888;
margin: 0 auto 24px;
white-space: pre-wrap;
}
.ending-stats {
display: flex;
flex-direction: column;
gap: 6px;
margin: 0 auto 24px;
padding: 14px;
background: rgba(212, 175, 55, 0.05);
border: 1px solid #6a5a33;
font-size: 11px;
color: #b8a370;
}
.ending-stats-row {
display: flex;
justify-content: space-between;
}
.ending-stats-row b { color: #ffeb70; }
.ending-btn-group {
display: flex;
flex-direction: column;
gap: 10px;
align-items: center;
}

.skip-btn {
position: absolute;
top: 10px; right: 10px;
z-index: 5;
padding: 6px 12px;
background: rgba(0, 0, 0, 0.6);
border: 1px solid #6a5a33;
color: #b8a370;
font-family: inherit;
font-size: 10px;
cursor: pointer;
}
.skip-btn:active { background: rgba(212, 175, 55, 0.2); }

.chapter-overlay {
position: absolute;
top: 0; left: 0; right: 0; bottom: 0;
background: #000;
z-index: 50;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
opacity: 0;
pointer-events: none;
transition: opacity 0.4s ease;
}
.chapter-overlay.show { opacity: 1; pointer-events: all; }
.chapter-num {
color: #8a7a4d;
letter-spacing: 0.5em;
font-size: 12px;
margin-bottom: 14px;
}
.chapter-title {
color: #e8d7a0;
font-size: 22px;
letter-spacing: 0.3em;
border-top: 1px solid #d4af37;
border-bottom: 1px solid #d4af37;
padding: 10px 28px;
}
.chapter-sub {
color: #8a7a4d;
font-size: 10px;
letter-spacing: 0.3em;
margin-top: 12px;
}

/* 図鑑 */
#codex-scene {
padding: 14px 14px 30px;
overflow-y: auto;
-webkit-overflow-scrolling: touch;

var state = {
  script: [],

  flags: {},
  levels: {},
  exp: {},

  totalTurns: 0,
  totalDamage: 0,

  pendingMinSize: 3,
  battle: null,
  defeatedEnemies: [],
  metChars: ["keihou"],
  endingsSeen: []
};

function initLevels() {
  for (var k in STATS) {
    state.levels[k] = 1;
    state.exp[k] = 0;
  }
}

function getStat(charKey) {
  var base = STATS[charKey];
  var lv = state.levels[charKey] || 1;
  return {
    hp: Math.floor(base.hp * (1 + (lv - 1) * 0.15)),
    atk: Math.floor(base.atk * (1 + (lv - 1) * 0.12)),
    def: Math.floor(base.def * (1 + (lv - 1) * 0.1)),
    lv: lv
  };
}

function getExpToNext(lv) {
  return 30 + lv * 20;
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ============================

  var c = CHARS[charKey];
  if (!c) return "";
  if (c.img) {
    return '<div class="char-card has-img ' + c.cls + '">' +
      '<img class="char-img" src="' + c.img + '" alt="' + c.name + '" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
      '<div style="display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;padding:16px">' +
        '<div class="char-symbol">' + c.symbol + '</div>' +
        '<div class="char-name">' + c.name + '</div>' +
        '<div class="char-title">' + c.title + '</div>' +
      '</div>' +
      '<div class="char-symbol-corner">' + c.symbol + '</div>' +
      '<div class="char-card-name-overlay">' +
        '<div class="char-name">' + c.name + '</div>' +
        '<div class="char-title">' + c.title + '</div>' +
      '</div>' +
    '</div>';
  } else {
    return '<div class="char-card ' + c.cls + '" style="padding:16px">' +
      '<div class="char-symbol">' + c.symbol + '</div>' +
      '<div class="char-name">' + c.name + '</div>' +

    '</div>';
  }
}

// 小さいシンボル（編成画面のロスター、図鑑、ally-cardなど用）
function smallSymbolHTML(charKey) {
  var c = CHARS[charKey];
  if (!c) return "";
  if (c.img) {
    return '<img src="' + c.img + '" alt="' + c.name + '" onerror="this.replaceWith(document.createTextNode(\'' + c.symbol + '\'))">';
  } else {
    return c.symbol;
  }
}

// ============================
// シーン制御
// ============================
function showScene(id) {
  var scenes = document.getElementsByClassName("scene");
  for (var i = 0; i < scenes.length; i++) {
    scenes[i].classList.remove("active");
  }
  document.getElementById(id).classList.add("active");
}

function startGame() {
  initLevels();
  state.unlocked = ["keihou"];
  state.metChars = ["keihou"];
  showScene("novel-scene");
  state.script = CH1.slice();
  state.index = -1;
  advance();
}

function continueGame() {
  startGame();
}

function restartGame() {
  showScene("title-scene");
  updateSaveInfo();
}

function showCodex() {
  showScene("codex-scene");
  switchCodexTab("chars");
}

function closeCodex() {
  showScene("title-scene");
  updateSaveInfo();
}

function goToCodex() {
  showCodex();
}

function updateSaveInfo() {
  var el = document.getElementById("save-info");
  var e = state.endingsSeen.length;
  var m = state.metChars.length;
  if (e > 0 || m > 1) {
    el.textContent = "仲間 " + m + "/10 ・ 結末 " + e + "/3";
    if (e > 0) {
      document.getElementById("continue-btn").style.display = "inline-block";
    }
  }
}

function skipScene() {
  if (!confirm("この章をスキップしますか?")) return;
  while (state.index < state.script.length - 1) {
    state.index++;
    var ev = state.script[state.index];
    if (ev.type === "choice" || ev.type === "battle" || ev.type === "party_select" || ev.type === "chapter" || ev.type === "ending") {
      state.index--;
      break;
    }
  }
  advance();
}

function advance() {
  state.index++;
  if (state.index >= state.script.length) return;
  var ev = state.script[state.index];
  if (!ev) return;
  
  if (ev.type === "chapter") {
    showChapter(ev.num, ev.title, ev.sub, advance);
    return;
  }
  if (ev.type === "choice") {
    showChoices(ev);
    return;
  }
  if (ev.type === "battle") {
    state.pendingBattle = ev;
    startBattle(ev);
    return;
  }
  if (ev.type === "party_select") {
    state.pendingBattle = ev.battle;
    state.pendingMinSize = ev.minSize || 3;
    openPartySelect(ev);
    return;
  }
  if (ev.type === "join") {
    showJoin(ev);
    return;
  }
  if (ev.type === "ending") {
    showEnding(ev);
    return;
  }
  renderDialog(ev);
}

var _typer = null;
function renderDialog(ev) {
  if (ev.bg) {
    document.getElementById("bg-layer").className = "bg-layer bg-" + ev.bg;
  }
  var portrait = document.getElementById("portrait");
  var speaker = document.getElementById("speaker");
  var dialog = document.getElementById("dialog-text");
  
  if (ev.char && CHARS[ev.char] && ev.char !== "narrator") {
    var c = CHARS[ev.char];
    portrait.innerHTML = bigCardHTML(ev.char);
    speaker.className = "speaker " + c.cls;
    speaker.textContent = c.name;
  } else {
    portrait.innerHTML = "";
    speaker.className = "speaker empty";
    speaker.textContent = "";
  }
  
  dialog.className = "dialog-text" + (ev.narration ? " narration" : "");
  dialog.textContent = "";
  
  var text = ev.text || "";
  var i = 0;
  if (_typer) clearInterval(_typer);
  _typer = setInterval(function() {
    if (i < text.length) {
      dialog.textContent += text[i++];
    } else {
      clearInterval(_typer);
      _typer = null;
    }
  }, 25);
}

function showChoices(ev) {
  var c = document.getElementById("choices");
  c.innerHTML = '<div class="choices-title">' + (ev.title || "― 選 択 ―") + '</div>';
  for (var i = 0; i < ev.options.length; i++) {
    (function(opt) {
      var btn = document.createElement("button");
      btn.className = "choice-btn";
      btn.textContent = opt.text;
      btn.onclick = function() {
        c.classList.remove("active");
        if (ev.flag) state.flags[ev.flag] = opt.value;
        handleChoice(ev.flag, opt.value);
      };
      c.appendChild(btn);
    })(ev.options[i]);
  }
  c.classList.add("active");
}

function handleChoice(flag, value) {
  var newScript = [];
  if (flag === "chapter1Choice") {
    var b = value === "trust" ? CH1_TRUST : CH1_SILENCE;
    newScript = b.concat(CH1_BATTLE, CH1_BRIDGE, CH2);
  } else if (flag === "chapter2Choice") {
    var b2 = value === "money" ? CH2_MONEY : CH2_ORDER;
    newScript = b2.concat(CH2_BATTLE, CH2_BRIDGE, CH3, CH4, CH5);
  } else if (flag === "finalChoice") {
    if (value === "order") newScript = END_ORDER;
    else if (value === "harmony") newScript = END_HARMONY;
    else newScript = END_TRUTH;
  }
  state.script = newScript;
  state.index = -1;
  advance();
}

function showChapter(num, title, sub, cb) {
  var ov = document.getElementById("chapter-overlay");
  document.getElementById("chapter-num").textContent = num;
  document.getElementById("chapter-title").textContent = title;
  document.getElementById("chapter-sub").textContent = sub || "";
  ov.classList.add("show");
  setTimeout(function() {
    ov.classList.remove("show");
    setTimeout(cb, 500);
  }, 1500);
}

function showJoin(ev) {
  var charKey = ev.char;
  if (state.unlocked.indexOf(charKey) < 0) {
    state.unlocked.push(charKey);
  }
  if (state.metChars.indexOf(charKey) < 0) {
    state.metChars.push(charKey);
  }
  var c = CHARS[charKey];
  document.getElementById("join-card-zone").innerHTML = bigCardHTML(charKey);
  document.getElementById("join-message").innerHTML =
    '<b style="color:#ffeb70">' + c.name + '</b> が、パーティに加わった!<br>' +
    '<small style="opacity:0.7;font-size:10px">タップして続ける</small>';
  document.getElementById("join-overlay").classList.add("show");
}

function closeJoin() {
  document.getElementById("join-overlay").classList.remove("show");
  advance();
}

// ============================
// パーティ編成
// ============================
function openPartySelect(ev) {
  showScene("party-scene");
  state.selected = [];
  var min = ev.minSize || 3;
  document.getElementById("party-instruction").textContent = min + "名のパーティを編成せよ";
  renderRoster();
  renderSlots(min);
  document.getElementById("party-confirm").disabled = true;
}

function renderRoster() {
  var grid = document.getElementById("roster-grid");
  grid.innerHTML = "";
  var order = ["keihou", "minpou", "minji", "keiji", "kaisha", "roudou", "zeihou", "gyosei", "chizai"];
  for (var idx = 0; idx < order.length; idx++) {
    (function(charKey, i) {
      var c = CHARS[charKey];
      var isUnlocked = state.unlocked.indexOf(charKey) >= 0;
      var s = getStat(charKey);
      var card = document.createElement("div");
      card.className = "roster-card " + c.cls + (isUnlocked ? "" : " locked");
      if (state.selected.indexOf(charKey) >= 0) card.classList.add("selected");
      if (isUnlocked) {
        card.innerHTML =
          '<div class="num">No.' + (i + 1 < 10 ? '0' + (i + 1) : (i + 1)) + '</div>' +
          '<div class="roster-row">' +
            '<div class="roster-symbol">' + smallSymbolHTML(charKey) + '</div>' +
            '<div class="roster-info">' +
              '<div class="roster-name">' + c.name + '</div>' +
              '<div class="roster-title">' + c.title + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="roster-stats">' +
            '<div class="roster-stat">Lv.<b>' + s.lv + '</b></div>' +
            '<div class="roster-stat">HP<b>' + s.hp + '</b></div>' +
            '<div class="roster-stat">ATK<b>' + s.atk + '</b></div>' +
          '</div>';
        card.onclick = function() { toggleSelect(charKey); };
      } else {
        card.innerHTML =
          '<div class="num">No.' + (i + 1 < 10 ? '0' + (i + 1) : (i + 1)) + '</div>' +
          '<div class="roster-row">' +
            '<div class="roster-symbol" style="font-size:20px">🔒</div>' +
            '<div class="roster-info">' +
              '<div class="roster-name">???</div>' +
              '<div class="roster-title">未加入</div>' +
            '</div>' +
          '</div>' +
          '<div class="roster-locked-text">物語を進めて解放</div>';
      }
      grid.appendChild(card);
    })(order[idx], idx);
  }
}

function renderSlots(min) {
  var row = document.getElementById("party-slot-row");
  row.innerHTML = "";
  for (var i = 0; i < min; i++) {
    var slot = document.createElement("div");
    var charKey = state.selected[i];
    if (charKey) {
      var c = CHARS[charKey];
      slot.className = "party-slot filled " + c.cls;
      if (c.img) {
        slot.innerHTML = 
          '<img class="party-slot-img" src="' + c.img + '" alt="' + c.name + '" onerror="this.style.display=\'none\'">' +
          '<div class="slot-symbol">' + c.symbol + '</div>' +
          '<div class="slot-name">' + c.name + '</div>';
      } else {
        slot.innerHTML = c.symbol + '<div class="slot-name">' + c.name + '</div>';
      }
      (function(ck) {
        slot.onclick = function() { toggleSelect(ck); };
      })(charKey);
    } else {
      slot.className = "party-slot";
      slot.textContent = "?";
    }
    row.appendChild(slot);
  }
}

function toggleSelect(charKey) {
  var min = state.pendingMinSize || 3;
  var idx = state.selected.indexOf(charKey);
  if (idx >= 0) {
    state.selected.splice(idx, 1);
  } else {
    if (state.selected.length >= min) {
      state.selected.shift();
    }
    state.selected.push(charKey);
  }
  renderRoster();
  renderSlots(min);
  document.getElementById("party-confirm").disabled = state.selected.length !== min;
}

function confirmParty() {
  var battleData = {};
  for (var k in state.pendingBattle) battleData[k] = state.pendingBattle[k];
  battleData.party = state.selected.slice();
  startBattle(battleData);
}

// ============================
// バトル
// ============================
function startBattle(ev) {
  showScene("battle-scene");
  state.totalBattles++;
  var enemyData = JSON.parse(JSON.stringify(ENEMIES[ev.enemy]));
  var allies = [];
  for (var i = 0; i < ev.party.length; i++) {
    var k = ev.party[i];
    var stat = getStat(k);
    allies.push({
      key: k, hp: stat.hp, maxHp: stat.hp,
      atk: stat.atk, def: stat.def, lv: stat.lv,
      statuses: {}
    });
  }
  state.battle = {
    enemy: enemyData,
    enemyHp: enemyData.hp,
    enemyMaxHp: enemyData.hp,
    enemyStatuses: {},
    allies: allies,
    currentAllyIdx: 0,
    turn: 1,
    phase: "ally"
  };
  document.getElementById("enemy-name").textContent = enemyData.name;
  document.getElementById("enemy-title").textContent = enemyData.title;
  document.getElementById("enemy-symbol").textContent = enemyData.symbol;
  document.getElementById("affinity-info").textContent = "敵特性：" + enemyData.desc;
  document.getElementById("enemy-card").classList.remove("dying");
  renderBattle();
  setBattleLog('『' + enemyData.name + '』が現れた!');
}

function renderBattle() {
  var b = state.battle;
  if (!b) return;
  var enemyPct = (b.enemyHp / b.enemyMaxHp) * 100;
  document.getElementById("hp-fill").style.width = enemyPct + "%";
  document.getElementById("hp-text").textContent = b.enemyHp + " / " + b.enemyMaxHp;
  document.getElementById("turn-info").textContent = "TURN " + b.turn;
  
  var eStatusEl = document.getElementById("enemy-statuses");
  eStatusEl.innerHTML = "";
  for (var k in b.enemyStatuses) {
    if (b.enemyStatuses[k] > 0) {
      var span = document.createElement("span");
      span.className = "status-icon " + (k === "poison" ? "poison" : k === "stun" ? "stun" : "buff");
      var labels = { poison: "毒", stun: "麻痺", debuff_def: "防↓" };
      span.textContent = labels[k] || k;
      eStatusEl.appendChild(span);
    }
  }
  
  var row = document.getElementById("ally-row");
  row.innerHTML = "";
  for (var idx = 0; idx < b.allies.length; idx++) {
    (function(ally, i) {
      var c = CHARS[ally.key];
      var card = document.createElement("div");
      card.className = "ally-card " + c.cls;
      if (ally.hp <= 0) card.classList.add("fainted");
      if (i === b.currentAllyIdx && b.phase === "ally") card.classList.add("acting");
      var hpPct = (ally.hp / ally.maxHp) * 100;
      var hpClass = hpPct < 25 ? "critical" : hpPct < 50 ? "low" : "";
      var statusHTML = "";
      var hasStatus = false;
      for (var sk in ally.statuses) { if (ally.statuses[sk] > 0) { hasStatus = true; break; } }
      if (hasStatus) {
        statusHTML = '<div class="ally-statuses">';
        for (var sk2 in ally.statuses) {
          if (ally.statuses[sk2] > 0) {
            var cls = "buff";
            var label = "?";
            if (sk2 === "buff_atk") label = "攻↑";
            else if (sk2 === "buff_def") label = "防↑";
            else if (sk2 === "shield") label = "盾";
            else if (sk2 === "doubt") { label = "疑"; cls = "stun"; }
            statusHTML += '<span class="status-icon ' + cls + '">' + label + '</span>';
          }
        }
        statusHTML += '</div>';
      }
      card.innerHTML = statusHTML +
        '<div class="ally-symbol">' + smallSymbolHTML(ally.key) + '</div>' +
        '<div class="ally-name">' + c.name + '</div>' +
        '<div class="ally-hp">' + ally.hp + '/' + ally.maxHp + '</div>' +
        '<div class="ally-hp-bar"><div class="ally-hp-fill ' + hpClass + '" style="width:' + hpPct + '%"></div></div>';
      card.id = "ally-" + i;
      row.appendChild(card);
    })(b.allies[idx], idx);
  }
  renderSkills();
}

function renderSkills() {
  var zone = document.getElementById("skill-zone");
  zone.innerHTML = "";
  var b = state.battle;
  if (!b || b.phase !== "ally") return;
  var ally = b.allies[b.currentAllyIdx];
  if (!ally || ally.hp <= 0) return;
  var skillKeys = CHAR_SKILLS[ally.key];
  for (var i = 0; i < skillKeys.length; i++) {
    (function(sk) {
      var s = SKILLS[sk];
      var c = CHARS[ally.key];
      var btn = document.createElement("button");
      btn.className = "skill-btn " + c.cls;
      var tag = "";
      if (s.target === "enemy" || s.target === "enemy_stun" || s.target === "enemy_drain" || s.target === "enemy_clear" || s.target === "enemy_poison") {
        if (b.enemy.weakness.indexOf(s.element) >= 0) tag = '<div class="skill-tag">弱点</div>';
        else if (b.enemy.resist.indexOf(s.element) >= 0) tag = '<div class="skill-tag weak">耐性</div>';
      }
      btn.innerHTML = tag +
        '<div class="si">' + s.icon + '</div>' +
        '<div class="sd">' +
          '<div class="sn">' + s.name + '</div>' +
          '<div class="sc">' + s.desc + '</div>' +
        '</div>';
      btn.onclick = function() { useSkill(sk); };
      zone.appendChild(btn);
    })(skillKeys[i]);
  }
}

function useSkill(skillKey) {
  var b = state.battle;
  if (!b || b.phase !== "ally") return;
  var ally = b.allies[b.currentAllyIdx];
  var s = SKILLS[skillKey];
  var c = CHARS[ally.key];
  
  if (ally.statuses.doubt > 0 && Math.random() < 0.3) {
    setBattleLog(c.name + "は疑念に囚われて、攻撃を外した!");
    advanceAllyTurn();
    return;
  }
  
  var atkMul = ally.statuses.buff_atk > 0 ? 1.4 : 1;
  
  var isAttack = (s.target === "enemy" || s.target === "enemy_stun" || s.target === "enemy_drain" || s.target === "enemy_clear" || s.target === "enemy_poison");
  
  if (isAttack) {
    var dmg = randInt(s.power[0], s.power[1]);
    dmg = Math.floor(dmg * (ally.atk / 50) * atkMul);
    var mod = "";
    var popClass = "";
    if (b.enemy.weakness.indexOf(s.element) >= 0) {
      dmg = Math.floor(dmg * 1.7);
      mod = "弱点!";
      popClass = "crit";
    } else if (b.enemy.resist.indexOf(s.element) >= 0) {
      dmg = Math.floor(dmg * 0.5);
      mod = "耐性。";
      popClass = "weak";
    }
    if (b.enemyStatuses.debuff_def > 0) dmg = Math.floor(dmg * 1.3);
    state.totalDamage += dmg;
    flashEffect();
    hitEnemy();
    popDamage(dmg, popClass);
    b.enemyHp = Math.max(0, b.enemyHp - dmg);
    var msg = c.name + "の" + s.name + "! " + mod + " " + dmg + "のダメージ!";
    if (s.target === "enemy_stun") {
      b.enemyStatuses.stun = 2;
      msg += " 麻痺!";
    } else if (s.target === "enemy_drain") {
      var heal = Math.floor(dmg * 0.4);
      ally.hp = Math.min(ally.maxHp, ally.hp + heal);
      popAllyHeal(b.currentAllyIdx, heal);
      msg += " " + heal + "回復!";
    } else if (s.target === "enemy_clear") {
      var had = false;
      for (var ek in b.enemyStatuses) { if (b.enemyStatuses[ek] > 0) had = true; }
      b.enemyStatuses = {};
      if (had) msg += " 強化解除!";
    } else if (s.target === "enemy_poison") {
      b.enemyStatuses.poison = 4;
      msg += " 毒!";
    }
    var logEl = document.getElementById("battle-log");
    logEl.className = "battle-log";
    if (popClass === "crit") logEl.classList.add("advantage");
    else if (popClass === "weak") logEl.classList.add("weakness");
    setBattleLog(msg);
  } else if (s.target === "ally_heal") {
    var heal2 = randInt(s.power[0], s.power[1]) + Math.floor(ally.atk * 0.3);
    for (var ai = 0; ai < b.allies.length; ai++) {
      if (b.allies[ai].hp > 0) {
        b.allies[ai].hp = Math.min(b.allies[ai].maxHp, b.allies[ai].hp + heal2);
        popAllyHeal(ai, heal2);
      }
    }
    setBattleLog(c.name + "の" + s.name + "! 全員" + heal2 + "回復!");
  } else if (s.target === "ally_buff") {
    for (var ai2 = 0; ai2 < b.allies.length; ai2++) {
      if (b.allies[ai2].hp > 0) b.allies[ai2].statuses.buff_atk = 3;
    }
    setBattleLog(c.name + "の" + s.name + "! 全員ATKアップ!");
  } else if (s.target === "ally_def") {
    for (var ai3 = 0; ai3 < b.allies.length; ai3++) {
      if (b.allies[ai3].hp > 0) b.allies[ai3].statuses.buff_def = 3;
    }
    setBattleLog(c.name + "の" + s.name + "! 全員DEFアップ!");
  } else if (s.target === "ally_shield") {
    for (var ai4 = 0; ai4 < b.allies.length; ai4++) {
      if (b.allies[ai4].hp > 0) b.allies[ai4].statuses.shield = 2;
    }
    setBattleLog(c.name + "の" + s.name + "! 全員に盾!");
  } else if (s.target === "ally_dispel") {
    for (var ai5 = 0; ai5 < b.allies.length; ai5++) {
      if (b.allies[ai5].hp > 0) {
        delete b.allies[ai5].statuses.doubt;
        delete b.allies[ai5].statuses.poison;
      }
    }
    setBattleLog(c.name + "の" + s.name + "! 異常回復!");
  }
  
  renderBattle();
  if (b.enemyHp <= 0) {
    setTimeout(victory, 900);
    return;
  }
  setTimeout(advanceAllyTurn, 700);
}

function advanceAllyTurn() {
  var b = state.battle;
  var next = b.currentAllyIdx + 1;
  while (next < b.allies.length && b.allies[next].hp <= 0) next++;
  if (next >= b.allies.length) {
    b.phase = "enemy";
    setTimeout(enemyTurn, 500);
  } else {
    b.currentAllyIdx = next;
    renderBattle();
  }
}

function enemyTurn() {
  var b = state.battle;
  if (b.enemyStatuses.poison > 0) {
    var pdmg = Math.floor(b.enemyMaxHp * 0.06);
    b.enemyHp = Math.max(0, b.enemyHp - pdmg);
    popDamage(pdmg, "weak");
    setBattleLog("敵は毒のダメージ! " + pdmg);
    state.totalDamage += pdmg;
    b.enemyStatuses.poison--;
    if (b.enemyStatuses.poison <= 0) delete b.enemyStatuses.poison;
    renderBattle();
    if (b.enemyHp <= 0) {
      setTimeout(victory, 900);
      return;
    }
    setTimeout(enemyTurnActual, 1100);
  } else {
    enemyTurnActual();
  }
}

function enemyTurnActual() {
  var b = state.battle;
  if (b.enemyStatuses.stun > 0) {
    setBattleLog("敵は麻痺して動けない!");
    b.enemyStatuses.stun--;
    if (b.enemyStatuses.stun <= 0) delete b.enemyStatuses.stun;
    setTimeout(endEnemyTurn, 1100);
    return;
  }
  var skillKey = b.enemy.skills[Math.floor(Math.random() * b.enemy.skills.length)];
  var eSkill = ENEMY_SKILLS[skillKey];
  if (eSkill.type === "attack") {
    var alive = [];
    for (var i = 0; i < b.allies.length; i++) {
      if (b.allies[i].hp > 0) alive.push(i);
    }
    if (alive.length === 0) { setTimeout(defeat, 600); return; }
    var tIdx = alive[Math.floor(Math.random() * alive.length)];
    setBattleLog("敵『" + b.enemy.name + "』が" + CHARS[b.allies[tIdx].key].name + eSkill.desc);
    attackAllyDirect(b.allies[tIdx], tIdx, eSkill);
  } else if (eSkill.type === "attack_all") {
    setBattleLog("敵『" + b.enemy.name + "』" + eSkill.desc);
    for (var j = 0; j < b.allies.length; j++) {
      if (b.allies[j].hp > 0) attackAllyDirect(b.allies[j], j, eSkill);
    }
  } else if (eSkill.type === "attack_all_doubt") {
    setBattleLog("敵『" + b.enemy.name + "』" + eSkill.desc);
    for (var k = 0; k < b.allies.length; k++) {
      if (b.allies[k].hp > 0) {
        b.allies[k].statuses.doubt = 2;
        attackAllyDirect(b.allies[k], k, eSkill);
      }
    }
  }
  setTimeout(endEnemyTurn, 1400);
}

function attackAllyDirect(ally, idx, eSkill) {
  var b = state.battle;
  if (ally.statuses.shield > 0) {
    ally.statuses.shield--;
    if (ally.statuses.shield <= 0) delete ally.statuses.shield;
    popAllyDamage(idx, "盾!");
    return;
  }
  var dmg = Math.floor(b.enemy.atk * eSkill.power);
  var defMul = ally.statuses.buff_def > 0 ? 0.6 : 1;
  dmg = Math.max(1, Math.floor(dmg * defMul - ally.def * 0.4));
  ally.hp = Math.max(0, ally.hp - dmg);
  var card = document.getElementById("ally-" + idx);
  if (card) {
    card.classList.add("hit");
    setTimeout(function() { card.classList.remove("hit"); }, 400);
  }
  popAllyDamage(idx, dmg);
}

function endEnemyTurn() {
  var b = state.battle;
  for (var ai = 0; ai < b.allies.length; ai++) {
    var a = b.allies[ai];
    for (var sk in a.statuses) {
      a.statuses[sk]--;
      if (a.statuses[sk] <= 0) delete a.statuses[sk];
    }
  }
  for (var ek in b.enemyStatuses) {
    if (ek !== "poison" && ek !== "stun") {
      b.enemyStatuses[ek]--;
      if (b.enemyStatuses[ek] <= 0) delete b.enemyStatuses[ek];
    }
  }
  var allDead = true;
  for (var ci = 0; ci < b.allies.length; ci++) {
    if (b.allies[ci].hp > 0) { allDead = false; break; }
  }
  if (allDead) {
    setTimeout(defeat, 700);
    return;
  }
  b.turn++;
  state.totalTurns++;
  var first = 0;
  while (first < b.allies.length && b.allies[first].hp <= 0) first++;
  b.currentAllyIdx = first;
  b.phase = "ally";
  renderBattle();
  setBattleLog("―― ターン" + b.turn + "。");
}

function victory() {
  var b = state.battle;
  if (state.defeatedEnemies.indexOf(b.enemy.name) < 0) {
    state.defeatedEnemies.push(b.enemy.name);
  }
  document.getElementById("enemy-card").classList.add("dying");
  setBattleLog("『" + b.enemy.name + "』を倒した!");
  setTimeout(function() {
    var expGained = b.enemy.exp;
    var alive = [];
    for (var i = 0; i < b.allies.length; i++) {
      if (b.allies[i].hp > 0) alive.push(b.allies[i]);
    }
    var perChar = alive.length > 0 ? Math.ceil(expGained / alive.length) : expGained;
    var levelups = [];
    for (var j = 0; j < alive.length; j++) {
      var a = alive[j];
      state.exp[a.key] = (state.exp[a.key] || 0) + perChar;
      while (state.exp[a.key] >= getExpToNext(state.levels[a.key])) {
        state.exp[a.key] -= getExpToNext(state.levels[a.key]);
        var before = state.levels[a.key];
        state.levels[a.key]++;
        levelups.push({ key: a.key, before: before, after: state.levels[a.key] });
      }
    }
    if (levelups.length > 0) {
      showLevelUp(levelups, perChar);
    } else {
      setBattleLog("勝利! 経験値+" + perChar + " を獲得!");
      setTimeout(endBattle, 1000);
    }
  }, 1200);
}

function showLevelUp(levelups, perChar) {
  var ov = document.getElementById("levelup-overlay");
  var list = document.getElementById("levelup-list");
  list.innerHTML = "";
  var expRow = document.createElement("div");
  expRow.className = "levelup-row";
  expRow.innerHTML = '<span>経験値獲得</span><span class="lv-after">+' + perChar + ' EXP</span>';
  list.appendChild(expRow);
  for (var i = 0; i < levelups.length; i++) {
    var lu = levelups[i];
    var c = CHARS[lu.key];
    var row = document.createElement("div");
    row.className = "levelup-row";
    row.innerHTML =
      '<div><span style="font-size:18px;margin-right:6px">' + c.symbol + '</span>' + c.name + '</div>' +
      '<div>Lv.' + lu.before + ' → <span class="lv-after">Lv.' + lu.after + '</span></div>';
    list.appendChild(row);
  }
  ov.classList.add("show");
}

function closeLevelup() {
  document.getElementById("levelup-overlay").classList.remove("show");
  endBattle();
}

function endBattle() {
  showScene("novel-scene");
  advance();
}

function defeat() {
  setBattleLog("パーティは全滅した……");
  setTimeout(function() {
    if (confirm("敗北……\n再戦しますか?")) {
      startBattle(state.pendingBattle);
    } else {
      restartGame();
    }
  }, 1300);
}

function flashEffect() {
  var flash = document.createElement("div");
  flash.className = "flash";
  document.getElementById("battle-scene").appendChild(flash);
  setTimeout(function() { if (flash.parentNode) flash.parentNode.removeChild(flash); }, 300);
}
function hitEnemy() {
  var enemy = document.getElementById("enemy-card");
  enemy.classList.add("hit");
  setTimeout(function() { enemy.classList.remove("hit"); }, 400);
}
function popDamage(dmg, cls) {
  var pop = document.createElement("div");
  pop.className = "damage-pop " + (cls || "");

  if (zone) {
    zone.appendChild(pop);
    setTimeout(function() { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 1000);
  }

function popAllyDamage(idx, dmg) {

  var pop = document.createElement("div");
  pop.className = "ally-damage-pop";
  pop.textContent = dmg;
  card.appendChild(pop);
  setTimeout(function() { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 1000);
}
function popAllyHeal(idx, heal) {
  var card = document.getElementById("ally-" + idx);
  if (!card) return;
  var pop = document.createElement("div");
  pop.className = "ally-damage-pop heal";
  pop.textContent = "+" + heal;
  card.appendChild(pop);
  setTimeout(function() { if (pop.parentNode) pop.parentNode.removeChild(pop); }, 1000);
}
function setBattleLog(msg) {
  document.getElementById("battle-log").textContent = msg;

function switchCodexTab(tab) {
  var tabs = document.getElementsByClassName("codex-tab");
  for (var i = 0; i < tabs.length; i++) {
    tabs[i].classList.toggle("active", tabs[i].dataset.tab === tab);
  }
  var content = document.getElementById("codex-content");
  content.innerHTML = "";
  if (tab === "chars") {
    for (var k in CHARS) {
      if (k === "narrator" || k === "enemy") continue;
      var c = CHARS[k];
      var seen = state.metChars.indexOf(k) >= 0;
      var div = document.createElement("div");
      div.className = "codex-entry " + c.cls + (seen ? "" : " locked");
      if (seen) {
        div.innerHTML =
          '<div class="ce-head">' +
            '<div class="ce-sym">' + smallSymbolHTML(k) + '</div>' +
            '<div><div class="ce-name">' + c.name + '</div>' +
            '<div class="ce-title">' + c.title + '</div></div>' +
          '</div>' +
          '<div class="ce-desc">' + (c.desc || "") + '</div>' +
          '<div class="ce-quote">「' + (c.quote || "") + '」</div>';
      } else {
        div.innerHTML =
          '<div class="ce-head"><div class="ce-sym" style="font-size:24px">🔒</div>' +
          '<div><div class="ce-name">???</div><div class="ce-title">未発見</div></div></div>' +
          '<div class="ce-desc">物語を進めて出会おう。</div>';
      }
      content.appendChild(div);
    }
  } else if (tab === "enemies") {
    for (var ek in ENEMIES) {
      var e = ENEMIES[ek];
      var eseen = state.defeatedEnemies.indexOf(e.name) >= 0;
      var ediv = document.createElement("div");
      ediv.className = "codex-entry c-enemy" + (eseen ? "" : " locked");
      if (eseen) {
        ediv.innerHTML =
          '<div class="ce-head"><div class="ce-sym">' + e.symbol + '</div>' +
          '<div><div class="ce-name">' + e.name + '</div>' +
          '<div class="ce-title">' + e.title + '</div></div></div>' +
          '<div class="ce-desc">' + e.desc + '</div>' +
          '<div class="ce-quote">HP ' + e.hp + ' ／ ATK ' + e.atk + '</div>';
      } else {
        ediv.innerHTML =
          '<div class="ce-head"><div class="ce-sym">🔒</div>' +
          '<div><div class="ce-name">???</div><div class="ce-title">未遭遇</div></div></div>' +
          '<div class="ce-desc">この敵にはまだ出会っていない。</div>';
      }
      content.appendChild(ediv);
    }
  } else if (tab === "endings") {
    var endings = [
      { route: "SHIELD ROUTE", title: "盾の章", desc: "憲法を孤独から救う道。" },
      { route: "ROUND TABLE ROUTE", title: "円卓の章", desc: "十の法による共治。" },
      { route: "DAWN ROUTE", title: "暁の章", desc: "憲法を看取り、原初の影と決戦。" }
    ];
    for (var ei = 0; ei < endings.length; ei++) {
      var eend = endings[ei];
      var enseen = state.endingsSeen.indexOf(eend.route) >= 0;
      var endiv = document.createElement("div");
      endiv.className = "codex-entry c-narrator" + (enseen ? "" : " locked");
      if (enseen) {
        endiv.innerHTML =
          '<div class="ce-head"><div class="ce-sym">📖</div>' +
          '<div><div class="ce-name">' + eend.title + '</div>' +
          '<div class="ce-title">' + eend.route + '</div></div></div>' +
          '<div class="ce-desc">' + eend.desc + '</div>';
      } else {
        endiv.innerHTML =
          '<div class="ce-head"><div class="ce-sym">🔒</div>' +
          '<div><div class="ce-name">???</div><div class="ce-title">未到達</div></div></div>' +
          '<div class="ce-desc">物語を最後まで進めよう。</div>';
      }
      content.appendChild(endiv);
    }
  }
}
